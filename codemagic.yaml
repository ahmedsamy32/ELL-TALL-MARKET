workflows:
  build_ios_simulator:
    name: Build iOS Simulator
    max_build_duration: 60
    triggering:
      events:
        - push
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Install Flutter packages
        script: |
          flutter pub get
      - name: Build iOS (simulator)
        script: |
          flutter build ios --simulator --no-codesign
    artifacts:
      - build/ios/iphonesimulator/**
