# Gradle Performance & Memory Settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false

# Android SDK Configuration
android.useAndroidX=true
android.enableJetifier=false
android.compileSdk=36
android.targetSdk=36
android.buildToolsVersion=36.0.0

# AGP Compatibility Flags
skipDependencyChecks=true
disable-abi-filtering=true
flutter.internal.agpVersion=8.13.0
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning

# Fix Kotlin compiler Windows file lock issues with incremental caches
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# Network Connection Timeouts (5 minutes) & Protocol Configuration
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.http.connectionTimeout=300000
systemProp.http.socketTimeout=300000
systemProp.https.connectionTimeout=300000
systemProp.https.socketTimeout=300000
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
