name: ell_tall_market
description: "Souq El Tal - سوق التل"
publish_to: 'none'

version: 1.1.9+18

environment:
  sdk: ^3.9.2

dependencies:
  # Flutter Framework & Localization
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.20.3

  # Firebase Services
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  firebase_analytics: ^13.1.0
  firebase_auth: ^7.1.0
  cloud_firestore: ^7.2.0

  # Supabase & Network
  supabase_flutter: ^2.10.2
  web_socket_channel: ^3.0.1
  http: ^1.1.0

  # State Management & Local Storage
  provider: ^6.1.5
  shared_preferences: ^2.2.1
  flutter_secure_storage: ^10.2.0
  flutter_dotenv: ^6.0.0

  # Location & Maps
  google_maps_flutter: ^2.5.0
  geolocator: ^14.0.2
  geocoding: ^5.0.0
  google_places_flutter: ^2.0.12
  flutter_polyline_points: ^3.1.0

  # Media & Image Handling
  image_picker: ^1.0.4
  image_cropper: ^12.2.1
  image: ^4.3.0
  cached_network_image: ^3.3.0

  # UI Components & Charts
  flutter_staggered_grid_view: ^0.7.0
  shimmer: ^3.0.0
  reorderables: ^0.6.0
  fl_chart: ^1.1.1
  syncfusion_flutter_charts: ^33.2.6
  flutter_keyboard_visibility: ^6.0.0

  # Payments
  flutter_stripe: ^15.0.0

  # Documents & File Processing
  pdf: ^3.11.1
  printing: ^5.13.4
  excel: ^4.0.6
  file_picker: ^12.0.0-beta.7
  path_provider: ^2.1.5
  path: ^1.9.0

  # Authentication
  google_sign_in: ^7.2.0

  # Device Features & System Utilities
  device_info_plus: ^13.2.0
  package_info_plus: ^10.2.0
  connectivity_plus: ^7.0.0
  permission_handler: ^12.0.1
  flutter_local_notifications: ^22.0.1
  url_launcher: ^6.1.14
  share_plus: ^13.2.0
  uuid: ^4.2.1
  logger: ^2.0.2
  equatable: ^2.0.5
  windows_single_instance: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.6
  msix: ^3.16.5

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icons/icon.png"
  windows:
    generate: true
    image_path: "assets/icons/icon.png"
  image_path: "assets/icons/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/config/
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700

msix_config:
  display_name: "سوق التل"
  publisher_display_name: "Souq El Tal"
  title: "سوق التل - Souq El Tal"
  logo_path: "assets/icons/icon.png"
  capabilities: "internetClient"
